{% extends 'app/base.html' %}
{% load static %}
{% block content_checkout %}
<section class="py-5" style="background-color: #f4f6f8; min-height: 70vh; display: flex; align-items: center;">
  <div class="container text-center">
    <div class="card-custom p-5 mx-auto shadow" style="max-width: 600px; border-radius: 15px; border: none;">
      <div class="mb-4">
        <i class="fas fa-times-circle text-danger" style="font-size: 80px;"></i>
      </div>
      <h2 class="fw-bold mb-3">Thanh Toán Bị Hủy!</h2>
      <p class="text-muted mb-4">Bạn đã hủy quá trình thanh toán hoặc giao dịch thất bại. Đơn hàng của bạn chưa được hoàn tất.</p>
      <a href="{% url 'checkout' %}" class="btn btn-outline-danger px-4 py-2 me-2" style="border-radius: 8px;">Thử lại</a>
      <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2" style="border-radius: 8px;">Về trang chủ</a>
    </div>
  </div>
</section>
{% endblock content_checkout %}
